plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.accesstransformers' version '2.0.0'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
    id 'net.darkhax.curseforgegradle' version '1.3.33'
    id 'com.modrinth.minotaur' version '2.10.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

minecraft {

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id,
                    '--all',
                    '--output', layout.projectDirectory.dir('src/generated/resources'),
                    '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency(
            "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    )

    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }

    repositories {
        maven {
            url = layout.buildDirectory.dir('repo')
        }
    }
}

def releaseName = "${mod_name} ${mod_version} for Forge ${minecraft_version}"

def changelogFile = file('src/main/resources/changelog.md')
def changelogText = changelogFile.exists()
        ? changelogFile.getText('UTF-8')
        : "${mod_name} ${mod_version} for Minecraft ${minecraft_version}"


modrinth {
    token = providers.gradleProperty('modrinth_api_token')
            .orElse(providers.environmentVariable('MODRINTH_TOKEN')).orNull

    projectId = providers.gradleProperty('modrinth_project_id').orNull

    versionNumber = mod_version.toString()
    versionName = releaseName
    versionType = 'release'

    uploadFile = tasks.named('jar').get()

    gameVersions = [minecraft_version.toString()]
    loaders = ['forge']

    changelog = changelogText
}

tasks.register('publishModrinth') {
    group = 'publishing'
    description = "Publishes ${mod_name} to Modrinth"

    dependsOn tasks.named('modrinth')
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = "Publishes ${mod_name} to CurseForge"

    apiToken = providers.gradleProperty('curseforge_api_token').orNull

    def projectId = providers.gradleProperty('curseforge_project_id').orNull

    if (projectId) {
        def mainFile = upload(projectId, tasks.named('jar').get())

        mainFile.displayName = releaseName
        mainFile.releaseType = 'release'

        mainFile.changelogType = 'markdown'
        mainFile.changelog = changelogText

        mainFile.addGameVersion(minecraft_version.toString())
        mainFile.addEnvironment('Client', 'Server')
    }
}

tasks.register('publishAll') {
    group = 'publishing'
    description = "Publishes ${mod_name} to CurseForge and Modrinth"

    dependsOn 'publishCurseForge', 'publishModrinth'
}